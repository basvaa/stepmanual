<style>
/* Layout: left rail (desktop) / bottom tab bar (phone). Today = one dial hero + live stats, then goals, timeline. Dark navy first, lime for the dial only. */
:root{
  --bg:#0a0f1f; --surface:#121a31; --surface2:#19233f; --line:#25314f;
  --fg:#eef2ff; --muted:#97a3c6; --accent:#c8f43a; --accent-ink:#c8f43a; --on-accent:#0a0f1f;
  --blue:#5b86ff; --violet:#a58bff; --warn:#ffb84d; --bad:#ff7384; --good:#59e0a0;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif; --body:'Instrument Sans','Segoe UI',system-ui,sans-serif;
  --nav-h:64px; color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#f2f4fb; --surface:#ffffff; --surface2:#eaeefb; --line:#d9dff0;
  --fg:#0d1431; --muted:#576088; --accent:#b9e92a; --accent-ink:#4a6b00; --on-accent:#0d1431;
  --blue:#2f5fe8; --violet:#6c4fe0; --warn:#a85f00; --bad:#c42a43; --good:#0a7d4b;
  --shadow:0 8px 24px rgba(20,30,70,.10); color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f2f4fb; --surface:#ffffff; --surface2:#eaeefb; --line:#d9dff0;
  --fg:#0d1431; --muted:#576088; --accent:#b9e92a; --accent-ink:#4a6b00; --on-accent:#0d1431;
  --blue:#2f5fe8; --violet:#6c4fe0; --warn:#a85f00; --bad:#c42a43; --good:#0a7d4b;
  --shadow:0 8px 24px rgba(20,30,70,.10); color-scheme:light}
*{box-sizing:border-box}
html,body{height:auto}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--body);margin:0}
button,input,select{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
.rail{position:sticky;top:0;height:100vh;padding:24px 16px;display:flex;flex-direction:column;gap:28px;border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font:700 22px var(--display);letter-spacing:-.02em;padding:0 8px}
.brand i{width:28px;height:28px;border-radius:50%;border:5px solid var(--accent);border-right-color:transparent;transform:rotate(-30deg);display:block}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;padding:10px 12px;border:0;background:none;border-radius:12px;color:var(--muted);cursor:pointer;text-align:left;font-weight:500}
.nav button:hover{background:var(--surface);color:var(--fg)}
.nav button[aria-current="page"]{background:var(--surface2);color:var(--fg)}
.nav svg{width:20px;height:20px;flex:none}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;color:var(--muted);font-size:13px}
main{padding:28px max(20px,env(safe-area-inset-right,0px)) 48px max(20px,env(safe-area-inset-left,0px));max-width:1120px;width:100%;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.top h1{font:700 clamp(26px,4vw,38px)/1.1 var(--display);letter-spacing:-.025em;text-wrap:balance}
.top p{color:var(--muted);margin-top:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);cursor:pointer;font-weight:600;min-height:42px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--bad);border-color:currentColor;background:none}
.btn.small{padding:6px 12px;min-height:34px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.hero{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:stretch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;min-width:0}
.card.flat{background:none}
.card h2{font:650 17px var(--display);letter-spacing:-.01em;margin-bottom:4px}
.sub{color:var(--muted);font-size:13px}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.banner{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:14px;border:1px dashed var(--muted);background:var(--surface);margin-bottom:16px;font-size:14px}
.banner b{color:var(--fg)}
.banner .btn{margin-left:auto;flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--surface2);white-space:nowrap}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.src-motion{background:var(--accent)} .src-import{background:var(--blue)} .src-manual{background:var(--violet)}
.src-preview{background:repeating-linear-gradient(135deg,var(--muted) 0 2px,transparent 2px 5px);border:1px solid var(--muted)}
.dial{position:relative;display:grid;place-items:center;padding:8px 0}
.dial svg{width:min(100%,330px);height:auto;display:block}
.dial .center{position:absolute;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.big{font:700 clamp(44px,9vw,64px)/1 var(--display);letter-spacing:-.04em}
.track{stroke:var(--surface2)} .arc{stroke:var(--accent);transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
.stat{display:flex;flex-direction:column;gap:2px;padding:14px 16px;border-radius:16px;background:var(--surface2)}
.stat .v{font:650 26px/1.1 var(--display);letter-spacing:-.02em}
.stat .v small{font:500 13px var(--body);color:var(--muted);margin-left:3px}
.stat .l{color:var(--muted);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.srcbar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--surface2);margin:12px 0 8px}
.srcbar span{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.meter{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;background:var(--blue);border-radius:99px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.meter.run i{background:var(--violet)} .meter.ok i{background:var(--accent)}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl li{display:grid;grid-template-columns:56px 14px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.tl li:first-child{border-top:0}
.tl time{color:var(--muted);font-size:13px}
.note{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.note:first-child{border-top:0}
.note svg{width:18px;height:18px;flex:none;margin-top:2px}
form.grid label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:500}
input[type=number],input[type=text],input[type=date],input[type=time],select{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-height:42px;width:100%;color:var(--fg)}
input:disabled{opacity:.5}
.err{color:var(--bad);font-size:13px;min-height:18px}
.ok{color:var(--good);font-size:13px}
.seg{display:inline-flex;background:var(--surface2);border-radius:12px;padding:3px;gap:2px;max-width:100%;overflow-x:auto}
.seg button{border:0;background:none;padding:7px 14px;border-radius:9px;cursor:pointer;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 4px rgba(0,0,0,.2)}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--muted);font:11px var(--body)}
.chart .gridl{stroke:var(--line);stroke-width:1}
.chart .goal{stroke:var(--accent-ink);stroke-dasharray:5 4;stroke-width:1.5}
.chart .bar{transform-box:fill-box;transform-origin:bottom;animation:grow .7s cubic-bezier(.2,.8,.2,1) both}
.chart .hit{fill:transparent;cursor:pointer}
.chart .hit:hover{fill:var(--fg);fill-opacity:.06}
.c-motion{fill:var(--accent)} .c-import{fill:var(--blue)} .c-manual{fill:var(--violet)} .c-goal{fill:var(--good)}
.c-preview{fill:url(#hatch)}
@keyframes grow{from{transform:scaleY(.02)}to{transform:scaleY(1)}}
.readout{min-height:44px;margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--surface2);font-size:13.5px}
.empty{display:grid;place-items:center;text-align:center;gap:8px;padding:36px 16px;color:var(--muted);border:1px dashed var(--line);border-radius:16px}
.empty b{color:var(--fg);font:650 17px var(--display)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .dow{font-size:12px;color:var(--muted);text-align:center;padding-bottom:4px}
.cal button{aspect-ratio:1;border-radius:12px;border:1px solid transparent;background:var(--surface2);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;min-width:0;padding:0;position:relative}
.cal button.blank{visibility:hidden}
.cal button small{font-size:10px;color:var(--muted)}
.cal .l1{background:color-mix(in srgb,var(--accent) 22%,var(--surface2))}
.cal .l2{background:color-mix(in srgb,var(--accent) 45%,var(--surface2))}
.cal .l3{background:color-mix(in srgb,var(--accent) 70%,var(--surface2))}
.cal .l4{background:var(--accent);color:var(--on-accent)} .cal .l4 small{color:var(--on-accent)}
.cal .pv::after{content:"";position:absolute;right:5px;top:5px;width:6px;height:6px;border-radius:2px;border:1px solid var(--muted);background:var(--surface)}
.cal button.sel{border-color:var(--fg)} .cal button.today{box-shadow:inset 0 0 0 2px var(--blue)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.badge{display:flex;gap:12px;padding:14px;border-radius:16px;background:var(--surface2);align-items:flex-start;min-width:0}
.badge .ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none;background:var(--surface);color:var(--muted)}
.badge.on .ico{background:var(--accent);color:var(--on-accent)}
.badge:not(.on){opacity:.82}
.badge svg{width:22px;height:22px}
.badge b{display:block}
.recs{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl td,.tbl th{padding:10px 8px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{color:var(--muted);font-weight:500;font-size:12.5px;border-top:0}
.scroll-x{overflow-x:auto}
.toast{position:fixed;left:50%;transform:translate(-50%,20px);bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:14px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:calc(100vw - 32px);font-weight:600}
.toast.show{opacity:1;transform:translate(-50%,0)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:70;width:100%;height:100%}
.onb{border-color:var(--accent-ink)}
.steps-dots{display:flex;gap:6px;margin:10px 0 14px}
.steps-dots i{height:4px;flex:1;border-radius:4px;background:var(--surface2)}
.steps-dots i.on{background:var(--accent)}
.skel{animation:pulse 1.2s infinite alternate;background:var(--surface2);border-radius:10px;height:16px}
@keyframes pulse{to{opacity:.4}}

.sdot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none;display:inline-block}
.sdot.tracking{background:var(--accent);animation:ping 1.8s infinite}
.sdot.starting{background:var(--warn)} .sdot.paused{background:var(--blue)}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 70%,transparent)}70%,100%{box-shadow:0 0 0 9px transparent}}
.btn.big{min-height:54px;font-size:17px;flex:1 1 180px}
details.help summary{cursor:pointer;font-weight:600;margin-top:14px}
.helplist{margin:8px 0 0;padding-left:20px;color:var(--muted);font-size:13.5px;display:grid;gap:6px}
.helplist b{color:var(--fg)}
.alert{padding:12px 14px;border-radius:14px;border:1px solid var(--bad);margin-top:14px;font-size:14px}
.alert b{color:var(--bad)}
.tabbar{display:none}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  main{padding-bottom:calc(var(--nav-h) + 40px + env(safe-area-inset-bottom,0px))}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:50;padding:0 max(8px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-left,0px))}
  .tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:var(--nav-h);border:0;background:none;color:var(--muted);font-size:11px;font-weight:600;cursor:pointer}
  .tabbar button[aria-current="page"]{color:var(--fg)}
  .tabbar svg{width:22px;height:22px}
  .hero,.g2,.g3{grid-template-columns:minmax(0,1fr)}
  .tl li{grid-template-columns:48px 12px minmax(0,1fr)} .tl li .pill{grid-column:3}
}
@media (max-width:420px){.stats{grid-template-columns:minmax(0,1fr) minmax(0,1fr)} .stat .v{font-size:22px} .banner{flex-wrap:wrap}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" style="fill:var(--surface2)"/><line x1="0" y1="0" x2="0" y2="6" style="stroke:var(--muted)" stroke-width="2.5"/></pattern>
</defs></svg>
<canvas id="confetti" aria-hidden="true"></canvas>
<div class="app">
  <aside class="rail"><div class="brand"><i></i>StepSync</div><nav class="nav" id="nav" aria-label="Main"></nav>
    <div class="rail-foot"><button class="btn small" id="themeBtn" type="button">Theme</button><span>Progress stays in this browser only.</span></div></aside>
  <main id="main" tabindex="-1"><div id="view"></div></main>
</div>
<nav class="tabbar" id="tabbar" aria-label="Main"></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
"use strict";
var KEY='stepsync.v1';
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var pad=function(n){return String(n).padStart(2,'0')};
var ymd=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var parse=function(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])};
var addDays=function(s,n){var d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
var today=function(){return ymd(new Date())};
var fmt=function(n,d){return Number(n).toLocaleString(undefined,{maximumFractionDigits:d||0,minimumFractionDigits:d||0})};
var mondayOf=function(s){var d=parse(s);var k=(d.getDay()+6)%7;d.setDate(d.getDate()-k);return ymd(d)};
var SRC=['motion'];
function fmtDur(ms){var s=Math.max(0,Math.round(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?h+':'+pad(m)+':'+pad(s%60):m+':'+pad(s%60)}

/* ---------- state + storage ---------- */
var storageOk=true,interruptedNote=false;
var DEFAULTS=function(){return{profile:{name:'',height:170,weight:70,stride:null},goals:{steps:8000,walk:45,run:10,activeDays:5},prefs:{theme:'system',celebrate:true,encourage:true},sessions:[],onboard:{done:false,step:0}}};
var S=DEFAULTS();
try{
  var raw=localStorage.getItem(KEY);
  if(raw){
    var p=JSON.parse(raw),d0=DEFAULTS();
    var sess=(Array.isArray(p.sessions)?p.sessions:[]).filter(function(s){return s&&typeof s.id==='string'&&s.b&&typeof s.b==='object'});
    sess.forEach(function(s){
      var n=0;Object.keys(s.b).forEach(function(k){n+=(s.b[k]&&s.b[k][0])||0});s.steps=n;
      if(s.status==='active'||s.status==='paused'){s.status='interrupted';interruptedNote=true}
    });
    S={profile:Object.assign(d0.profile,p.profile),goals:Object.assign(d0.goals,p.goals),prefs:Object.assign(d0.prefs,p.prefs),sessions:sess.filter(function(s){return s.steps>0}),onboard:Object.assign(d0.onboard,p.onboard)};
    /* older versions kept manual, imported and sample entries in "records"; they are not carried over */
  }
}catch(e){storageOk=false}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){storageOk=false}}

/* ---------- step detector (also unit-tested on its own) ---------- */
/*DETECTOR-START*/
/* Acceleration-peak step detector.
   Input: raw accelerometer samples (m/s^2, gravity included) with a ms timestamp.
   1. Magnitude removes dependence on phone orientation.
   2. A fast low-pass filter removes sensor noise; a slow average estimates gravity; their difference is the movement signal.
   3. Local maxima above an adaptive threshold (45% of the recent average peak, never below 0.8 m/s^2) are candidate steps.
   4. A minimum gap of 280 ms rejects double bumps inside one stride; peaks above 30 m/s^2 (drops, hard shakes) are ignored.
   5. Candidates only count once 4 in a row arrive 280-1500 ms apart with similar spacing, longest within 1.45x of shortest (walking rhythm). Those 4 are then
      credited together, and later steps count one by one, each spaced like the recent steps (0.55x to 1.7x). A gap over 1.5 s, or a sensor gap over 0.5 s, resets the chain. */
function createDetector(){
  var MIN_DT=280,MAX_DT=1500,CONFIRM=4,MAX_PEAK=30,MIN_THR=0.8;
  var s;
  function reset(){s={t:0,init:false,lp:0,g:0,p1:0,p2:0,pt1:0,chain:[],confirmed:false,avgDt:600,avgPeak:2.2}}
  reset();
  function onPeak(t,pk){
    var last=s.chain.length?s.chain[s.chain.length-1]:null;
    if(last!==null){
      var d=t-last;
      if(d<MIN_DT)return [];
      if(d>MAX_DT){s.chain=[];s.confirmed=false}
    }
    if(s.confirmed&&last!==null){
      var gap=t-last;
      if(gap>s.avgDt*1.7||gap<s.avgDt*0.55){s.confirmed=false;s.chain=[t];return []}
      s.avgDt=0.8*s.avgDt+0.2*gap;
    }
    s.chain.push(t);
    s.avgPeak=0.8*s.avgPeak+0.2*Math.min(pk,8);
    if(s.confirmed){s.chain=[t];return [t]}
    if(s.chain.length>=CONFIRM){
      var c=s.chain.slice(-CONFIRM),mn=1e9,mx=0;
      for(var i=1;i<c.length;i++){var dd=c[i]-c[i-1];mn=Math.min(mn,dd);mx=Math.max(mx,dd)}
      if(mx/mn<=1.45){s.confirmed=true;s.avgDt=(c[c.length-1]-c[0])/(CONFIRM-1);var out=c.slice();s.chain=[c[c.length-1]];return out}
      s.chain.shift();
    }
    return [];
  }
  function push(ax,ay,az,t){
    var mag=Math.sqrt(ax*ax+ay*ay+az*az);
    if(!isFinite(mag))return [];
    if(!s.init){s.init=true;s.t=t;s.lp=mag;s.g=mag;return []}
    var dt=t-s.t;
    if(dt<=0)return [];
    if(dt>500){s.t=t;s.lp=mag;s.g=mag;s.p1=s.p2=0;s.chain=[];s.confirmed=false;return []}
    s.t=t;
    s.lp+=dt/(30+dt)*(mag-s.lp);
    s.g+=dt/(800+dt)*(mag-s.g);
    var hp=s.lp-s.g,out=[];
    if(s.p1>s.p2&&s.p1>=hp){
      var thr=Math.max(MIN_THR,0.45*s.avgPeak);
      if(s.p1>=thr&&s.p1<MAX_PEAK)out=onPeak(s.pt1,s.p1);
    }

  var F=function(id,l,v,ex){return '<label>'+l+'<input type="number" id="'+id+'" value="'+v+'" '+ex+'></label>'};
  return '<div class="grid g2"><section class="card"><h2>Profile</h2><p class="sub">Used for distance and calorie estimates.</p><form class="grid g2" style="margin-top:12px" onsubmit="return false">'+
   '<label>Name<input type="text" id="s-name" value="'+esc(p.name)+'" maxlength="30"></label>'+F('s-h','Height (cm)',p.height,'min="100" max="230"')+F('s-w','Weight (kg)',p.weight,'min="30" max="250"')+
   '<label>Stride length (cm)<input type="number" id="s-stride" value="'+(custom?p.stride:Math.round(strideCm()))+'" min="30" max="150" '+(custom?'':'disabled')+'></label>'+
   '<label style="flex-direction:row;align-items:center;gap:8px;grid-column:1/-1"><input type="checkbox" id="s-custom" '+(custom?'checked':'')+' style="width:18px;height:18px"> Set my own stride length (otherwise 0.415 × height)</label></form><div class="err" id="setErr"></div></section>'+
  '<section class="card"><h2>Goals</h2><p class="sub">Defaults are common starting points. Change them any time.</p><form class="grid g2" style="margin-top:12px" onsubmit="return false">'+F('s-goal','Daily steps',g.steps,'min="1000" max="50000" step="500"')+F('s-days','Goal days per week',g.activeDays,'min="1" max="7"')+F('s-walk','Walking minutes per day',g.walk,'min="0" max="600"')+F('s-run','Running minutes per day',g.run,'min="0" max="600"')+'</form></section></div>'+
  '<div class="grid g2" style="margin-top:16px"><section class="card"><h2>Preferences</h2><div class="stack" style="margin-top:12px"><div><span class="sub">Theme</span><div class="seg" style="display:flex;margin-top:6px">'+['system','dark','light'].map(function(t){return '<button type="button" data-theme-set="'+t+'" aria-pressed="'+(pr.theme===t)+'">'+t[0].toUpperCase()+t.slice(1)+'</button>'}).join('')+'</div></div>'+
   '<label class="row"><input type="checkbox" id="s-enc" '+(pr.encourage?'checked':'')+' style="width:18px;height:18px"> Show encouraging messages</label><label class="row"><input type="checkbox" id="s-cel" '+(pr.celebrate?'checked':'')+' style="width:18px;height:18px"> Celebrate when I reach my goal</label></div></section>'+
  '<section class="card"><h2>How tracking works</h2><div class="scroll-x"><table class="tbl" style="margin-top:8px"><tr><th>Topic</th><th>Details</th></tr>'+
   '<tr><td>Step source</td><td>Your phone’s motion sensor, read through the browser. Steps cannot be entered by hand.</td></tr>'+
   '<tr><td>Detection</td><td>Acceleration peaks above an adaptive threshold, at least 280 ms apart, counted once they form a steady walking rhythm.</td></tr>'+
   '<tr><td>Distance</td><td>Steps × stride length. Default stride is 0.415 × your height.</td></tr>'+
   '<tr><td>Calories</td><td>Weight × distance × 0.6 for walking, up to 1.0 for running. A rough estimate, not a medical measure.</td></tr>'+
   '<tr><td>Limits</td><td>Counts only while the page is open and the screen is on. No background or 24/7 tracking, and no sync between devices.</td></tr></table></div></section></div>'+
  '<section class="card" style="margin-top:16px"><h2>Your data</h2><p class="sub">Everything lives in this browser only. It does not sync to other devices and clearing site data erases it. There are no accounts.</p><div class="row" style="margin-top:12px"><button class="btn" data-act="export-csv" type="button">Export walks (CSV)</button><button class="btn" data-act="export-json" type="button">Export all (JSON)</button></div>'+
   '<div class="row" style="margin-top:14px">'+(confirmDel?'<span class="err" style="min-height:0">Delete all '+S.sessions.length+' walks and reset settings?</span><button class="btn danger" data-act="del-confirm" type="button">Yes, delete everything</button><button class="btn" data-act="del-cancel" type="button">Cancel</button>':'<button class="btn danger" data-act="del-ask" type="button">Delete all my data</button>')+'</div><div class="sub" id="exportMsg" style="margin-top:8px" role="status"></div></section>';
}

/* ---------- render ---------- */
function applyTheme(){var t=S.prefs.theme,r=document.documentElement;if(t==='system')r.removeAttribute('data-theme');else r.setAttribute('data-theme',t)}
function render(){
  applyTheme();nav();renderedDay=today();
  var c=ctx(),t=TITLES[view];
  var head='<header class="top"><div><h1>'+(view==='today'?greet():t[0])+'</h1><p>'+(view==='today'?parse(c.t).toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'}):t[1])+'</p></div><span class="pill" id="hdrPill" role="status">'+pillHTML()+'</span></header>';
  var body={today:viewToday,trends:viewTrends,history:viewHistory,awards:viewAwards,settings:viewSettings}[view](c);
  $('#view').innerHTML=head+(view==='today'?'':bannerHTML())+body;
  var arc=$('#arc');if(arc){var to=+arc.dataset.to;requestAnimationFrame(function(){requestAnimationFrame(function(){arc.setAttribute('stroke-dashoffset',to);lastOffset=to})})}
}
function go(v){view=v;try{history.replaceState(null,'','#'+v)}catch(e){}render();window.scrollTo(0,0)}

/* ---------- data export / reset ---------- */
function csvEscape(v){v=String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function blobSave(name,data,type){var b=new Blob([data],{type:type}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},4000)}
function exportData(kind){
  var msg=$('#exportMsg');
  if(!S.sessions.length){msg.textContent='There are no saved walks to export yet.';return}
  var data,name,type;
  if(kind==='csv'){data='session_start,session_end,steps,active_min,session_min,status\n'+S.sessions.map(function(s){return [new Date(s.start).toISOString(),new Date(s.end).toISOString(),s.steps,((s.activeMs||0)/60000).toFixed(1),((s.elapsedMs||0)/60000).toFixed(1),s.status].map(csvEscape).join(',')}).join('\n');name='stepsync-walks.csv';type='text/csv'}
  else{data=JSON.stringify({exportedAt:new Date().toISOString(),profile:S.profile,goals:S.goals,preferences:S.prefs,sessions:S.sessions},null,2);name='stepsync-export.json';type='application/json'}
  if(window.claude&&claude.use){
    claude.use('downloads').then(function(dl){
      if(!dl){msg.textContent='Saving files is not available in this view.';return}
      return dl.save({filename:name,data:data}).then(function(){msg.textContent='Saved '+name+'.'}).catch(function(e){msg.textContent=e&&e.code==='declined'?'Export cancelled.':'Could not save the file. Try again.'});
    }).catch(function(){msg.textContent='Saving files is not available in this view.'});
  }else{try{blobSave(name,data,type);msg.textContent='Download started: '+name}catch(e){msg.textContent='Your browser blocked the download.'}}
}
function setNum(id,key,obj,min,max,int){
  var el=$('#'+id),v=+el.value,e=$('#setErr');
  if(el.value===''||isNaN(v)||v<min||v>max){if(e)e.textContent='Enter a value between '+min+' and '+max+'.';return false}
  obj[key]=int?Math.round(v):v;save();if(e)e.textContent='';return true;
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-nav],[data-act],[data-period],[data-metric],[data-day],[data-month],[data-del],[data-theme-set],[data-bi]');if(!t)return;
  var D=t.dataset;
  if(D.nav)return go(D.nav);
  if(D.period){PER.period=D.period;return render()}
  if(D.metric){PER.metric=D.metric;return render()}
  if(D.bi!==undefined){var r=$('#readout');if(r)r.innerHTML=readoutText(+D.bi);return}
  if(D.day){calSel=D.day;return render()}
  if(D.month){var y=+calMonth.slice(0,4),m=+calMonth.slice(5)-1+ +D.month,d=new Date(y,m,1);calMonth=d.getFullYear()+'-'+pad(d.getMonth()+1);return render()}
  if(D.del){if(T.session&&T.session.id===D.del){toast('Stop tracking before deleting the walk in progress');return}S.sessions=S.sessions.filter(function(s){return s.id!==D.del});save();toast('Walk deleted');return render()}
  if(D.themeSet){S.prefs.theme=D.themeSet;save();return render()}
  switch(D.act){
   case 'trk-start':return startTracking();
   case 'trk-pause':return pauseTracking();
   case 'trk-resume':return resumeTracking();
   case 'trk-stop':return stopTracking();
   case 'trk-cancel':detach();T.status=T.session?'paused':'idle';render();return;
   case 'sum-close':T.summary=null;return render();
   case 'onb-next':S.onboard.step=1;save();return render();
   case 'onb-skip':case 'onb-done':S.onboard.done=true;save();return render();
   case 'onb-save':
     var h=+$('#o-h').value,w=+$('#o-w').value,g=+$('#o-g').value;
     if(!(h>=100&&h<=230)||!(w>=30&&w<=250)||!(g>=1000&&g<=50000)){$('#onbErr').textContent='Check your numbers: height 100 to 230 cm, weight 30 to 250 kg, goal 1,000 to 50,000 steps.';return}
     S.profile.name=$('#o-name').value.trim().slice(0,30);S.profile.height=h;S.profile.weight=w;S.goals.steps=Math.round(g);S.onboard.step=2;save();return render();
   case 'export-csv':return exportData('csv');
   case 'export-json':return exportData('json');
   case 'del-ask':confirmDel=true;return render();
   case 'del-cancel':confirmDel=false;return render();
   case 'del-confirm':detach();stopTick();unlock();T.session=null;T.status='idle';T.summary=null;T.err=null;S=DEFAULTS();S.onboard.done=true;save();confirmDel=false;interruptedNote=false;lastOffset=null;toast('All data deleted');return render();
  }
});
document.addEventListener('change',function(e){
  var id=e.target.id;if(!id)return;
  var done=false;
  if(id==='s-name'){S.profile.name=e.target.value.trim().slice(0,30);save();done=true}
  else if(id==='s-h')done=setNum(id,'height',S.profile,100,230);
  else if(id==='s-w')done=setNum(id,'weight',S.profile,30,250);
  else if(id==='s-stride')done=setNum(id,'stride',S.profile,30,150);
  else if(id==='s-custom'){S.profile.stride=e.target.checked?Math.round(strideCm()):null;save();done=true}
  else if(id==='s-goal')done=setNum(id,'steps',S.goals,1000,50000,true);
  else if(id==='s-days')done=setNum(id,'activeDays',S.goals,1,7,true);
  else if(id==='s-walk')done=setNum(id,'walk',S.goals,0,600,true);
  else if(id==='s-run')done=setNum(id,'run',S.goals,0,600,true);
  else if(id==='s-enc'){S.prefs.encourage=e.target.checked;save();done=true}
  else if(id==='s-cel'){S.prefs.celebrate=e.target.checked;save();done=true}
  if(done){if(id==='s-custom')render();else toast('Saved')}
});
$('#themeBtn').addEventListener('click',function(){var o=['system','dark','light'];S.prefs.theme=o[(o.indexOf(S.prefs.theme)+1)%3];save();render();toast('Theme: '+S.prefs.theme)});
window.addEventListener('hashchange',function(){var h=location.hash.slice(1);if(TITLES[h]&&h!==view){view=h;render()}});
/* start a new local day: re-render once the calendar date changes, unless it would disturb a form being edited */
setInterval(function(){if(today()!==renderedDay&&!(document.activeElement&&document.activeElement.tagName==='INPUT'))render()},30000);
var h0=location.hash.slice(1);if(TITLES[h0])view=h0;
render();
})();

</script>
</body>
</html>
